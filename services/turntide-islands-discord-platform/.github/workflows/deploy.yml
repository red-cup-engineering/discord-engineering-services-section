name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Turntide Islands
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11 --activate

      - name: Verify settlement runtime
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run build
          pnpm test

      - name: Package settlement-owned runtime
        run: tar czf ../release.tar.gz dist package.json pnpm-lock.yaml node_modules

      - name: Deploy to red-cedar-gate
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/turntide_deploy
          chmod 600 ~/.ssh/turntide_deploy
          echo "45.76.19.133 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAXUeCY4L7IOhpo87wdazete84wgQjFRSRbF3YirUolz" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/turntide_deploy -o UserKnownHostsFile=~/.ssh/known_hosts emsenn@45.76.19.133 < ../release.tar.gz
